# cloudbuild/run.yaml
options:
  machineType: "E2_HIGHCPU_8"
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'sync-assets'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -euo pipefail
        if [ -d "./pipelines/src/pipelines/${_PIPELINE_TEMPLATE}/${_PIPELINE}/assets/" ]; then
          echo "Syncing assets to GCS"
          gsutil -m rsync -r -d ./pipelines/src/pipelines/${_PIPELINE_TEMPLATE}/${_PIPELINE}/assets ${_PIPELINE_FILES_GCS_PATH}/${_PIPELINE}/assets
        else
          echo "No assets folder found for pipeline ${_PIPELINE}"
        fi
  - name: 'python:3.11'
    id: 'run-pipeline'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -euo pipefail
        cd pipelines/src
        # instalacija dependencies
        pip install --no-cache-dir -r ../requirements.txt
        # pokretanje pipeline
        python -m pipelines.trigger --template_path=./${_PIPELINE}.json --enable_caching=${_ENABLE_PIPELINE_CACHING}




substitutions:
  _PIPELINE_TEMPLATE: 'xgboost'
  _PIPELINE: 'training'
  _PIPELINE_FILES_GCS_PATH: ''
  _ENABLE_PIPELINE_CACHING: 'false'


timeout: '3600s'
