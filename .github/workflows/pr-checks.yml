---
name: Pull Request Checks

"on":
  pull_request:
    branches: [develop, main]

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: pipelines
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: pipelines
        run: pytest tests/trigger

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: pre-commit
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init and validate all envs
        run: |
          for env in envs/*; do
            terraform -chdir="$env" init -backend=false
            terraform -chdir="$env" validate
          done

  pipeline-compile:
    name: Compile Pipelines
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: pipelines
        run: |
          pip install -r requirements.txt

      - name: Compile tensorflow pipeline
        shell: bash
        run: |
          for pipeline in training prediction; do
            make compile-pipeline PIPELINE_TEMPLATE=tensorflow pipeline=$pipeline
          done

      - name: Compile xgboost pipeline
        shell: bash
        run: |
          for pipeline in training prediction; do
            make compile-pipeline PIPELINE_TEMPLATE=xgboost pipeline=$pipeline
          done
